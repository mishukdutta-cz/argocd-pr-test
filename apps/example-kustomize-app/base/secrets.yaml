apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: example-kustomize-app # Not "aws": two apps share the namespace in this test
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: set-by-overlay
      sessionTagsPolicy: Simple
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-kustomize-app
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: example-kustomize-app
    kind: SecretStore
  target:
    name: example-kustomize-app
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: example-kustomize-app/db-password
