apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: SecretStore
      name: example-kustomize-app
    patch: |-
      - op: replace
        path: /spec/provider/aws/role
        value: arn:aws:iam::111111111111:role/data-example-kustomize-app
