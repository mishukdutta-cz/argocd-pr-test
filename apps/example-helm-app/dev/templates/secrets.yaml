# Syntax:
#   SecretStore: https://external-secrets.io/latest/api/secretstore/
#   ExternalSecret: https://external-secrets.io/latest/api/externalsecret/
# How a secret gets to the app:
#   1. You create the secret in AWS Secrets Manager (example-helm-app/db-password).
#   2. ESO copies it into a Kubernetes Secret every hour (the ExternalSecret below).
#   3. The container reads that Secret when it starts (envFrom in deployment.yaml).
#      A changed secret reaches a running container only after a restart.

# SecretStore: how ESO connects to Secrets Manager
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws{{ .Values.nameSuffix }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: arn:aws:iam::111111111111:role/data-example-helm-app # ESO assumes this app role. It reads only this app's secrets.
      sessionTagsPolicy: Simple # ESO tags each request with the namespace. The app role checks it.
---
# ExternalSecret: what ESO copies, and where to
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-helm-app{{ .Values.nameSuffix }}
spec:
  refreshPolicy: Periodic # ESO reads Secrets Manager on the timer, and when this object changes
  refreshInterval: 1h
  secretStoreRef:
    name: aws{{ .Values.nameSuffix }} # The SecretStore above
    kind: SecretStore
  target:
    name: example-helm-app{{ .Values.nameSuffix }} # The Kubernetes Secret that ESO creates
  data:
    - secretKey: DB_PASSWORD # The key in the Kubernetes Secret. It becomes the environment variable name.
      remoteRef:
        key: example-helm-app/db-password # The secret's name in Secrets Manager
