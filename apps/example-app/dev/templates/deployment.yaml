apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app{{ .Values.nameSuffix }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-app{{ .Values.nameSuffix }}
  template:
    metadata:
      labels:
        app: example-app{{ .Values.nameSuffix }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
